<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impact</title>
<meta name="description" content="Heal the planet together: 5 AI agents, live air data, and real eco actions.">
<meta name="theme-color" content="#0f1b33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="globe" aria-label="The shared planet with five AI agents"></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="hud">
  <button class="pill me" id="meBtn" aria-label="Your profile"><img id="meAv" alt=""><span><b id="meName">You</b><small id="meLv">Lv 1</small></span></button>
  <div class="hud-right">
    <button class="pill" id="agentsBtn"><svg class="ic"><use href="#i-agents"/></svg>Agents<span class="dot" id="agentsDot" hidden></span></button>
    <span class="pill stat" title="Seeds"><svg class="ic"><use href="#i-seed"/></svg><b id="seedN">0</b></span>
    <span class="pill stat net" id="net" title="Connection"><i></i><b id="netT">…</b></span>
  </div>
  <div class="zones" id="zones"></div>
</header>

<div id="toast" role="status" aria-live="polite"></div>

<section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
  <div class="sheet-head"><h2 id="sheetT"></h2><button class="x" id="sheetX" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="sheet-body" id="sheetB"></div>
</section>

<div class="modal" id="modal" hidden><div class="card" id="modalC"></div></div>

<nav id="tabbar">
  <button data-tab="today"><svg class="ic"><use href="#i-sun"/></svg>Today<span class="dot" id="goDot" hidden></span></button>
  <button data-tab="globe" class="on"><svg class="ic"><use href="#i-globe"/></svg>Planet</button>
  <button data-tab="log" class="play"><span><svg class="ic"><use href="#i-plus"/></svg></span>Log</button>
  <button data-tab="agents"><svg class="ic"><use href="#i-agents"/></svg>Council</button>
  <button data-tab="neighbors"><svg class="ic"><use href="#i-home"/></svg>Street</button>
</nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-agents" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 13.8c2.9-.4 5.5 1.5 5.5 4.7"/></symbol>
    <symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 3c4 3 5 8 0 18-5-10-4-15 0-18z"/><path d="M12 8v9"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5 8c3 1 4 4 3 6s1 4 3 4M14 3.5c-1 2 0 4 2 4.5s3 2 2.5 4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="2"/><path d="M8 21l3-7 3 3v4M11 14l1-5 4 3h3M12 9l-4 2-1 3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 5c0 9-5 14-13 14z"/><path d="M5 19l8-8"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6 9.5V20h12V9.5M10 20v-5h4v5"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V4.5A1.5 1.5 0 0 1 4.5 3H7M17 3h2.5A1.5 1.5 0 0 1 21 4.5V7M21 17v2.5a1.5 1.5 0 0 1-1.5 1.5H17M7 21H4.5A1.5 1.5 0 0 1 3 19.5V17M7 8h10M7 12h10M7 16h6"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M16 9c1.5 1.7 1.5 4.3 0 6M19 7c2.7 2.8 2.7 7.2 0 10"/></symbol>
  </defs>
</svg>

<script src="factors.js"></script>
<script src="agents-engine.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
